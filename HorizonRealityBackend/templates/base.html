{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>{% block title %}Horizon Reality{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}{% endblock %}">

    <!-- Favicons -->
    <!-- <link href="{% static 'img/favicon.png' %}" rel="icon">
    <link href="{% static 'img/apple-touch-icon.png' %}" rel="apple-touch-icon"> -->

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <!-- Vendor CSS Files -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/aos/aos.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/glightbox/css/glightbox.min.css' %}" rel="stylesheet">

    <!-- Main CSS File -->
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
    
    {% block extra_css %}
    <style>
        :root {
            --primary-color: #ff9d1f;
            --primary-rgb: 255, 157, 31;
            --secondary-color: #2c3e50;
            --text-dark: #333333;
            --text-light: #666666;
            --border-light: #e0e0e0;
            --shadow-light: rgba(0, 0, 0, 0.1);
            --shadow-medium: rgba(0, 0, 0, 0.15);
            /* --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); */
        }

        #header, #header * {
            font-family: 'Times New Roman', Times, serif !important;
        }
        * {
            font-family: 'Times New Roman', Times, serif
        }
    </style>
    {% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    <!-- Header -->
    {% include 'additionals/navigation.html' %}


    <main class="main">
        {% block content %}{% endblock %}
    </main>

    {% include "additionals/footer.html" %}

    <!-- Scroll Top Button -->
    <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
        <i class="bi bi-arrow-up-short"></i>
    </a>

    <!-- Preloader -->
    <div id="preloader"></div>

    <!-- Vendor JS Files -->
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'vendor/php-email-form/validate.js' %}"></script>
    <script src="{% static 'vendor/aos/aos.js' %}"></script>
    <script src="{% static 'vendor/swiper/swiper-bundle.min.js' %}"></script>
    <script src="{% static 'vendor/glightbox/js/glightbox.min.js' %}"></script>
    <script src="{% static 'vendor/imagesloaded/imagesloaded.pkgd.min.js' %}"></script>
    <script src="{% static 'vendor/isotope-layout/isotope.pkgd.min.js' %}"></script>
    <script src="{% static 'vendor/purecounter/purecounter_vanilla.js' %}"></script>

    <!-- Main JS File -->
    <script src="{% static 'js/main.js' %}"></script>
    
    <!-- Enhanced dropdown functionality - FIXED for right-side submenus -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Enhanced dropdown functionality with pure CSS hover
        const dropdowns = document.querySelectorAll('.dropdown');
        
        dropdowns.forEach(dropdown => {
            const toggle = dropdown.querySelector('.dropdown-toggle');
            const menu = dropdown.querySelector('.dropdown-menu');
            
            if (toggle && menu) {
                let timeoutId;
                
                // Show dropdown on hover
                dropdown.addEventListener('mouseenter', function() {
                    clearTimeout(timeoutId);
                    menu.style.display = 'block';
                    menu.style.opacity = '1';
                    menu.style.visibility = 'visible';
                    menu.style.transform = 'translateY(0)';
                });
                
                // Hide dropdown on leave with slight delay
                dropdown.addEventListener('mouseleave', function() {
                    timeoutId = setTimeout(() => {
                        menu.style.opacity = '0';
                        menu.style.visibility = 'hidden';
                        menu.style.transform = 'translateY(-10px)';
                        setTimeout(() => {
                            menu.style.display = 'none';
                        }, 300);
                    }, 150);
                });
                
                // Prevent dropdown from closing when clicking on toggle
                toggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                });
            }
        });
        
        // Handle submenu interactions - FIXED for right-side positioning
        const submenus = document.querySelectorAll('.dropdown-submenu');
        
        submenus.forEach(submenu => {
            const submenuToggle = submenu.querySelector('.dropdown-item');
            const submenuMenu = submenu.querySelector('.dropdown-menu');
            
            if (submenuToggle && submenuMenu) {
                let submenuTimeoutId;
                
                // Prevent default click behavior
                submenuToggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                });
                
                // Show submenu on hover
                submenu.addEventListener('mouseenter', function() {
                    clearTimeout(submenuTimeoutId);
                    submenuMenu.style.display = 'block';
                    submenuMenu.style.opacity = '1';
                    submenuMenu.style.visibility = 'visible';
                    submenuMenu.style.transform = 'translateX(0)';
                });
                
                // Hide submenu on leave with slight delay
                submenu.addEventListener('mouseleave', function() {
                    submenuTimeoutId = setTimeout(() => {
                        submenuMenu.style.opacity = '0';
                        submenuMenu.style.visibility = 'hidden';
                        submenuMenu.style.transform = 'translateX(10px)'; // FIXED: Changed from translateX(-10px) to translateX(10px)
                        setTimeout(() => {
                            submenuMenu.style.display = 'none';
                        }, 300);
                    }, 150);
                });
            }
        });
        
        // Close all dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown')) {
                dropdowns.forEach(dropdown => {
                    const menu = dropdown.querySelector('.dropdown-menu');
                    if (menu) {
                        menu.style.opacity = '0';
                        menu.style.visibility = 'hidden';
                        menu.style.transform = 'translateY(-10px)';
                        setTimeout(() => {
                            menu.style.display = 'none';
                        }, 300);
                    }
                });
            }
        });
        
        // Handle escape key to close dropdowns
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                dropdowns.forEach(dropdown => {
                    const menu = dropdown.querySelector('.dropdown-menu');
                    if (menu) {
                        menu.style.opacity = '0';
                        menu.style.visibility = 'hidden';
                        menu.style.transform = 'translateY(-10px)';
                        setTimeout(() => {
                            menu.style.display = 'none';
                        }, 300);
                    }
                });
            }
        });
    });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
